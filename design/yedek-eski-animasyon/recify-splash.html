<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recify – Giriş Animasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #eef1f6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 16px;
  }
  .phone {
    position: relative;
    width: min(340px, 86vw);
    aspect-ratio: 9 / 19.5;
    max-height: 80vh;
    background: #ffffff;
    border-radius: 42px;
    border: 10px solid #0b1d4a;
    box-shadow: 0 20px 50px rgba(11,29,74,.25);
    overflow: hidden;
  }
  #zoom { position: absolute; inset: 0; will-change: transform, opacity; backface-visibility: hidden; }
  .phone svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .app {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    opacity: 0; padding: 48px 20px 20px; gap: 12px;
    background: linear-gradient(180deg, #f5f8ff, #ffffff);
  }
  .app h2 { font: 700 22px "Lexend", sans-serif; color: #0b1d4a; }
  .app .card { height: 70px; border-radius: 16px; background: #e6eeff; }
  .app .card.big { height: 130px; background: linear-gradient(135deg,#00d9ff,#0062f0); }
  .controls { display: flex; gap: 10px; }
  button {
    font: 600 15px system-ui, sans-serif; padding: 10px 20px; border-radius: 999px;
    border: none; background: #0062f0; color: #fff; cursor: pointer;
  }
  button.ghost { background: #fff; color: #0b1d4a; border: 1px solid #c9d3e6; }
  .hint { font-size: 13px; color: #5a6782; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="app" id="app">
    <h2>Fişlerim</h2>
    <div class="card big"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

  <div id="zoom">
  <svg id="stage" viewBox="420 30 696 960" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#00e8ff"/>
        <stop offset="0.38" stop-color="#0a6cf2"/>
        <stop offset="0.75" stop-color="#0a2a8a"/>
        <stop offset="1" stop-color="#0a3fa6"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.95" cy="0.95" r="0.35">
        <stop offset="0" stop-color="#00e5ff" stop-opacity=".95"/>
        <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shine" cx="0.1" cy="0.05" r="0.75">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#0a84ff"/>
        <stop offset="1" stop-color="#00d4ff"/>
      </linearGradient>
      <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#bfe6ff"/>
        <stop offset="0.35" stop-color="#ffffff"/>
      </linearGradient>
      <linearGradient id="unused" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1b3a8c"/>
        <stop offset="1" stop-color="#0b1d4a"/>
      </linearGradient>
      <linearGradient id="dot" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#00d4ff"/>
        <stop offset="1" stop-color="#0a84ff"/>
      </linearGradient>
      <!-- fiş R’nin üst çubuğunun altından çıksın -->
      <clipPath id="printClip">
        <rect x="380" y="292" width="780" height="400"/>
      </clipPath>
    </defs>

    <!-- Logonun tamamı: büyüyüp kaybolacak grup -->
    <g id="logo" style="transform-box: view-box; transform-origin: 768px 375px;">

      <!-- Mavi uygulama kutusu -->
      <g id="tile" style="transform-box: view-box; transform-origin: 768px 375px; opacity:0">
        <rect x="495" y="118" width="546" height="516" rx="130" fill="url(#bg)"/>
        <rect x="495" y="118" width="546" height="516" rx="130" fill="url(#glow)"/>
        <path d="M495 400 C540 240 700 135 900 125 L625 118 C560 118 495 175 495 248 Z" fill="#ffffff" opacity=".12"/>
        <rect x="495" y="118" width="546" height="516" rx="130" fill="url(#shine)"/>
      </g>

      <!-- Yazar kasa ağzı (ince yarık) -->
      <rect id="slit" x="580" y="286" width="285" height="10" rx="5" fill="#061542" style="opacity:0"/>

      <!-- R harfi -->
      <path id="R" pathLength="1"
        d="M632 228 L850 228 C915 228 958 280 958 338 C958 388 925 425 882 438 L957 522 L878 525 C868 525 860 520 856 515 L790 432 L800 397 C803 390 808 386 815 386 L835 386 C862 386 885 365 885 338 C885 312 862 291 838 291 L688 291 C683 291 679 289 677 286 Z"
        fill="url(#leg)" fill-opacity="0" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"
        stroke-dasharray="1 1" stroke-dashoffset="1"/>

      <!-- Fiş -->
      <g clip-path="url(#printClip)">
        <g id="receipt" style="transform: translateY(-232px)">
          <g id="paper">
            <path d="M672 323 L828 323 C838 323 846 325 846 328 C820 336 802 370 792 402 L771 472 C764 495 757 508 751 513 L740 500 L728 513 L708 500 L686 513 L664 500 L642 513 L620 500 L598 513 L568 513 C580 494 590 470 600 440 L616 393 C629 350 646 323 672 323 Z"
              fill="#ffffff"/>
          </g>
          <rect class="ln" x="646" y="361" width="122" height="17" rx="8.5" fill="url(#line)"/>
          <rect class="ln" x="634" y="396" width="120" height="17" rx="8.5" fill="url(#line)"/>
          <rect class="ln" x="622" y="431" width="117" height="17" rx="8.5" fill="url(#line)"/>
        </g>
      </g>

      <!-- Yazı -->
      <g id="word" style="opacity:0">
        <text id="wordText" x="768" y="838" text-anchor="middle"
              font-family="Lexend, sans-serif" font-weight="700" font-size="196"
              letter-spacing="-4" fill="#0b1d4a">Recıfy</text>
        <path id="idot" d="M0 0" fill="url(#dot)"/>
      </g>
    </g>
  </svg>
  </div>
</div>

<div class="controls">
  <button id="replay">Tekrar oynat</button>
  <button class="ghost" id="slow">Yavaş çekim</button>
</div>
<p class="hint">Süre: ~4,5 sn</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const anims = [];
  let rate = 1;

  function placeDot() {
    // "ı" harfinin üstüne logodaki gibi mavi eğik nokta koy
    try {
      const t = $('wordText');
      const b = t.getExtentOfChar(3);
      const cx = b.x + b.width / 2 + 6;
      const top = b.y + b.height * 0.24;
      $('idot').setAttribute('d',
        `M${cx-28} ${top+18} L${cx+4} ${top-8} L${cx+30} ${top+4} L${cx-2} ${top+32} Z`);
    } catch (e) {}
  }

  function A(el, frames, opts) {
    const a = el.animate(frames, Object.assign({ fill: 'both', easing: 'ease-out' }, opts));
    a.playbackRate = rate;
    anims.push(a);
    return a;
  }

  function play() {
    anims.forEach(a => a.cancel());
    anims.length = 0;
    placeDot();

    // 1) Mavi uygulama kutusu beliriyor
    A($('tile'), [
      { opacity: 0, transform: 'scale(.55)' },
      { opacity: 1, transform: 'scale(1.04)', offset: .7 },
      { opacity: 1, transform: 'scale(1)' }
    ], { delay: 0, duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });

    // yazar kasa ağzı (yarık) beliriyor
    A($('slit'), [{ opacity: 0, transform: 'scaleX(.3)' }, { opacity: 1, transform: 'scaleX(1)' }],
      { delay: 300, duration: 250, easing: 'ease-out' });
    $('slit').style.transformBox = 'fill-box'; $('slit').style.transformOrigin = 'center';

    // 2) Fiş yazar kasadan çıkıyormuş gibi kesik kesik besleniyor
    const STEPS = 9, FROM = -232, frames = [];
    for (let i = 0; i <= STEPS; i++) {
      const y = FROM + (0 - FROM) * i / STEPS;
      if (i > 0) frames.push({ transform: `translateY(${y}px)`, offset: (i - 0.45) / STEPS });
      frames.push({ transform: `translateY(${y}px)`, offset: i / STEPS });
    }
    frames[0].offset = 0;
    A($('receipt'), frames, { delay: 550, duration: 1200, easing: 'linear' });

    // 3) R harfi (biraz daha yavaş) çiziliyor, sonra dolduruluyor
    A($('slit'), [{ opacity: 1 }, { opacity: 0 }],
      { delay: 1850, duration: 400 });
    A($('R'), [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }],
      { delay: 1850, duration: 950, easing: 'ease-in-out' });
    A($('R'), [{ fillOpacity: 0 }, { fillOpacity: 1 }],
      { delay: 2600, duration: 400 });
    A($('R'), [{ strokeOpacity: 1 }, { strokeOpacity: 0 }],
      { delay: 2800, duration: 250 });

    // 4) "Recify" yazısı
    A($('word'), [
      { opacity: 0, transform: 'translateY(30px)' },
      { opacity: 1, transform: 'translateY(0)' }
    ], { delay: 2850, duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });

    // 5) Logo büyüyerek ekrana yaklaşıyor ve kayboluyor
    //    (HTML katmanında, ekran kartı ile -> takılma yok)
    const z = $('zoom'), zr = z.getBoundingClientRect(), tr = $('tile').getBoundingClientRect();
    z.style.transformOrigin = `${tr.left + tr.width/2 - zr.left}px ${tr.top + tr.height/2 - zr.top}px`;
    A(z, [
      { transform: 'scale(1)', opacity: 1 },
      { transform: 'scale(0.94)', opacity: 1, offset: .2 },
      { transform: 'scale(5)', opacity: 0 }
    ], { delay: 3700, duration: 700, easing: 'cubic-bezier(.5,0,.75,.25)' });

    // Uygulama ana ekranı ortaya çıkıyor
    A($('app'), [{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }],
      { delay: 4150, duration: 400 });
  }

  $('replay').onclick = () => { rate = 1; play(); };
  $('slow').onclick = () => { rate = 0.35; play(); };

  const start = () => setTimeout(play, 300);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
  else start();
})();
</script>
</body>
</html>
